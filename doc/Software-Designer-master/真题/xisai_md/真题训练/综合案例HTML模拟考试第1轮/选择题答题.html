<html lang="zh-CN">
<head>

  <style>
    :root { --paper:#edf9df; --panel:#d7e8c8; --line:#91aa7f; --ink:#111; --blue:#2f76c4; --orange:#ff7a1a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei", "SimSun", sans-serif; font-size:15px; }
    .app { display:grid; grid-template-columns:220px 1fr 560px; height:100vh; min-width:1180px; }
    aside { border-right:2px solid #8da47e; background:#e7f5d7; overflow:auto; }

    .side-title { background:#cfe2bd; padding:9px 8px; font-weight:700; border-bottom:1px solid #aabd9a; }
    .numbers { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; padding:8px 6px 20px; }
    .num { height:32px; border:1px solid #6ba3d8; background:#f8fcff; cursor:pointer; font-family:Consolas, monospace; }
    .num.active { border:2px solid var(--orange); background:#fff8ef; }
    .num.done { background:#d9ebff; }
    main { display:grid; grid-template-rows:auto 38px 1fr auto; border-right:1px solid #a4b993; min-width:0; }
    .intro { padding:8px 10px; font-weight:700; line-height:1.8; background:#eef9df; border-bottom:1px solid #9caf8d; }
    .toolbar { display:flex; align-items:center; gap:8px; padding:4px 8px; border-top:3px double #777; border-bottom:1px solid #9caf8d; background:#eef9df; color:#1473c3; }
    .tool { border:1px solid #9bb8d6; background:#fff; padding:2px 8px; color:#1473c3; }
    .stem { overflow:auto; padding:12px; line-height:1.8; }
    .question-image { max-width:96%; display:block; margin:8px 0; border:1px solid #b9cba8; background:#fff; }
    pre { background:#f8fff1; border:1px solid #b5c9a6; padding:10px; overflow:auto; }
    .nav { display:flex; justify-content:space-between; padding:8px 12px; border-top:1px solid #a4b993; background:#e2f0d3; }
    .nav button, .submit, .restart { border:1px solid #4d8ccb; background:#fff; padding:6px 14px; cursor:pointer; }
    .submit { background:#e95b42; color:#fff; border-color:#a22d1e; }
    .submit:disabled { background:#b8b8b8; border-color:#888; cursor:not-allowed; }
    .restart { border-color:#6f8e56; color:#244b1e; }
    .actions { display:flex; align-items:center; gap:8px; }
    .right { display:grid; grid-template-rows:auto 1fr auto; min-width:0; }
    .status { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #9caf8d; background:#e7f5d7; }
    .timer { font-family:Consolas, monospace; font-size:20px; font-weight:700; color:#b42b20; }
    .options { overflow:auto; padding:22px 24px; }
    .option { display:grid; grid-template-columns:34px 30px 1fr; gap:8px; align-items:start; margin-bottom:20px; cursor:pointer; line-height:1.7; }
    .option input { width:17px; height:17px; margin-top:4px; }
    .option .letter { font-weight:700; }
    .option.selected { background:#dff0ff; outline:1px solid #77a7d8; }
    .source { color:#53644b; font-size:13px; padding:8px 12px; border-top:1px solid #9caf8d; }
  </style>
</head>

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function inlineMarkdown(value) {
  return escapeHtml(value)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img class="question-image" alt="$1" src="$2">')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function renderMarkdown(md) {
  const blocks = [];
  let text = String(md ?? '').replace(/\r\n/g, '\n');
  text = text.replace(/\`\`\`([\s\S]*?)\`\`\`/g, (_, code) => {
    const token = '%%CODE' + blocks.length + '%%';
    blocks.push('<pre><code>' + escapeHtml(code.trim()) + '</code></pre>');
    return token;
  });
  let html = text.split(/\n{2,}/).map(part => {
    if (/^%%CODE\d+%%$/.test(part.trim())) return part.trim();
    if (/^#{1,4}\s+/m.test(part.trim())) {
      return '<p>' + inlineMarkdown(part.replace(/^#{1,4}\s+/gm, '')) + '</p>';
    }
    return '<p>' + inlineMarkdown(part.trim()) + '</p>';
  }).join('');
  blocks.forEach((block, index) => { html = html.replace('%%CODE' + index + '%%', block); });
  return html;
}
function stamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}
function downloadJson(filename, payload) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

  const q = QUESTIONS[current];
  renderNumbers();
  document.getElementById('currentLabel').textContent = '第' + q.examNo + '题';
  document.getElementById('stem').innerHTML = renderMarkdown(q.stem);
  document.getElementById('source').textContent = '题源：' + q.sourceFile + ' 第' + q.sourceQuestionNo + '题；分布：' + q.range;
  document.getElementById('options').innerHTML = q.options.map(opt => {
    const checked = answers[q.examNo] === opt.key;
    return '<label class="option ' + (checked ? 'selected' : '') + '"><span>' + q.examNo + '</span><input type="radio" name="opt" value="' + opt.key + '"' + (checked ? ' checked' : '') + '><span><span class="letter">' + opt.key + '.</span> ' + inlineMarkdown(opt.text) + '</span></label>';
  }).join('');
  document.querySelectorAll('input[name=opt]').forEach(input => {
    input.addEventListener('change', () => {
      answers[q.examNo] = input.value;
      saveAnswers();
      render();
    });
  });
}
document.getElementById('prevBtn').addEventListener('click', () => { current = Math.max(0, current - 1); render(); });
document.getElementById('nextBtn').addEventListener('click', () => { current = Math.min(QUESTIONS.length - 1, current + 1); render(); });
function submit(forced=false) {
  if (submitted) return;
  submitted = true;
  const payload = {
    paper: '软件设计师综合知识选择题HTML模拟第1轮',
    submittedAt: new Date().toISOString(),
    forced,
    sources: QUESTIONS.map(q => ({ examNo:q.examNo, sourceFile:q.sourceFile, sourceQuestionNo:q.sourceQuestionNo, range:q.range })),
    answers
  };
  localStorage.setItem(SUBMIT_KEY, JSON.stringify(payload));
  downloadJson('选择题答题答案_' + stamp() + '.json', payload);
  setTimeout(() => { window.location.href = '案例题答题.html'; }, 1500);
}
document.getElementById('submitBtn').addEventListener('click', () => submit(false));
document.getElementById('restartBtn').addEventListener('click', () => resetMockExam('选择题答题.html'));
function tick() {
  const elapsed = Date.now() - choiceStart;
  const remain = 2 * 60 * 60 * 1000 - elapsed;
  document.getElementById('timer').textContent = formatTime(remain);
  const canSubmit = remain <= 30 * 60 * 1000;
  document.getElementById('submitBtn').disabled = !canSubmit;
  document.getElementById('submitBtn').textContent = canSubmit ? '交卷' : '剩余30分钟后可交卷';
  if (remain <= 0) submit(true);
}
render();
tick();
setInterval(tick, 1000);
</script>
